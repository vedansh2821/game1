<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay in the Air — game1</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 0;
            padding: 16px;
        }
        canvas {
            border: 1px solid #d3d3d3;
            background-color: #f1f1f1;
            display: block;
            margin: 0 auto;
        }
        button {
            font-size: 18px;
            padding: 10px 24px;
            margin: 12px 4px 0;
            cursor: pointer;
        }
        #restartBtn {
            display: none;
        }
        a {
            color: blue;
            text-decoration: none;
        }
        footer {
            margin-top: 24px;
            color: #555;
        }
    </style>
</head>
<body onload="startGame()">
    <script>
        var myGamePiece;
        var myObstacles = [];
        var myScore;
        var gameOver = false;

        function startGame() {
            myGamePiece = new component(30, 30, "red", 10, 120);
            myGamePiece.gravity = 0.05;
            myScore = new component("30px", "Consolas", "black", 280, 40, "text");
            myObstacles = [];
            gameOver = false;
            document.getElementById("restartBtn").style.display = "none";
            myGameArea.start();
        }

        function restartGame() {
            clearInterval(myGameArea.interval);
            startGame();
        }

        var myGameArea = {
            canvas: document.createElement("canvas"),
            start: function () {
                this.canvas.width = 480;
                this.canvas.height = 270;
                this.context = this.canvas.getContext("2d");
                document.body.insertBefore(this.canvas, document.body.childNodes[0]);
                this.frameNo = 0;
                this.interval = setInterval(updateGameArea, 20);
            },
            clear: function () {
                this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
            },
            stop: function () {
                clearInterval(this.interval);
            }
        }

        function component(width, height, color, x, y, type) {
            this.type = type;
            this.score = 0;
            this.width = width;
            this.height = height;
            this.speedX = 0;
            this.speedY = 0;
            this.x = x;
            this.y = y;
            this.gravity = 0;
            this.gravitySpeed = 0;
            this.update = function () {
                ctx = myGameArea.context;
                if (this.type == "text") {
                    ctx.font = this.width + " " + this.height;
                    ctx.fillStyle = color;
                    ctx.fillText(this.text, this.x, this.y);
                } else {
                    ctx.fillStyle = color;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            }
            this.newPos = function () {
                this.gravitySpeed += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY + this.gravitySpeed;
                this.hitBottom();
            }
            this.hitBottom = function () {
                var rockbottom = myGameArea.canvas.height - this.height;
                if (this.y > rockbottom) {
                    this.y = rockbottom;
                    this.gravitySpeed = 0;
                }
            }
            this.crashWith = function (otherobj) {
                var myleft = this.x;
                var myright = this.x + (this.width);
                var mytop = this.y;
                var mybottom = this.y + (this.height);
                var otherleft = otherobj.x;
                var otherright = otherobj.x + (otherobj.width);
                var othertop = otherobj.y;
                var otherbottom = otherobj.y + (otherobj.height);
                var crash = true;
                if ((mybottom < othertop) || (mytop > otherbottom) || (myright < otherleft) || (myleft > otherright)) {
                    crash = false;
                }
                return crash;
            }
        }

        function updateGameArea() {
            var x, height, gap, minHeight, maxHeight, minGap, maxGap;
            for (var i = 0; i < myObstacles.length; i += 1) {
                if (myGamePiece.crashWith(myObstacles[i])) {
                    endGame();
                    return;
                }
            }
            myGameArea.clear();
            myGameArea.frameNo += 1;
            if (myGameArea.frameNo == 1 || everyinterval(150)) {
                x = myGameArea.canvas.width;
                minHeight = 20;
                maxHeight = 200;
                height = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
                minGap = 50;
                maxGap = 200;
                gap = Math.floor(Math.random() * (maxGap - minGap + 1) + minGap);
                myObstacles.push(new component(10, height, "green", x, 0));
                myObstacles.push(new component(10, myGameArea.canvas.height - height - gap, "green", x, height + gap));
            }
            for (var i = 0; i < myObstacles.length; i += 1) {
                myObstacles[i].x += -1;
                myObstacles[i].update();
            }
            myScore.text = "SCORE: " + myGameArea.frameNo;
            myScore.update();
            myGamePiece.newPos();
            myGamePiece.update();
        }

        function endGame() {
            gameOver = true;
            myGameArea.stop();
            var ctx = myGameArea.context;
            ctx.font = "30px Consolas";
            ctx.fillStyle = "black";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", myGameArea.canvas.width / 2, myGameArea.canvas.height / 2 - 10);
            ctx.font = "20px Consolas";
            ctx.fillText("Score: " + myGameArea.frameNo, myGameArea.canvas.width / 2, myGameArea.canvas.height / 2 + 25);
            ctx.textAlign = "left";
            document.getElementById("restartBtn").style.display = "inline-block";
        }

        function everyinterval(n) {
            if ((myGameArea.frameNo / n) % 1 == 0) { return true; }
            return false;
        }

        function accelerate(n) {
            myGamePiece.gravity = n;
        }

        // Keyboard: hold Space / ArrowUp to rise, release to fall.
        document.addEventListener("keydown", function (e) {
            if ((e.code === "Space" || e.code === "ArrowUp") && !gameOver) {
                e.preventDefault();
                accelerate(-0.1);
            }
        });
        document.addEventListener("keyup", function (e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                accelerate(0.05);
            }
        });
    </script>
    <br>
    <button id="accelerateBtn" onmousedown="accelerate(-0.1)" onmouseup="accelerate(0.05)"
        ontouchstart="accelerate(-0.1); event.preventDefault();" ontouchend="accelerate(0.05)">ACCELERATE</button>
    <button id="restartBtn" onclick="restartGame()">RESTART</button>
    <p>Use the ACCELERATE button (or hold <b>Space</b> / <b>&uarr;</b>) to stay in the air</p>
    <p>How long can you stay alive?</p>
    <footer>
        <p>Copyright vedanshvyas</p>
        <p>Check <a href="https://www.ved2821.live">Click Here</a> for more</p>
    </footer>
</body>
</html>
